[package]
name = "ept"
version = "0.3.1"
edition = "2021"

[profile.release]
lto = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
Inflector = "0.11.4"
anyhow = "1.0.98"
base64 = "0.22.1"
blake3 = { version = "1.8.2", features = ["rayon"] }
chrono = "0.4.41"
clap = { version = "4.5.39", features = ["derive"] }
colored = "3.0.0"
console = "0.15.11"
dirs = "6.0.0"
ed25519-compact = "2.1.1"
encoding = "0.2.33"
evalexpr = "12.0.2"
force-delete-win = "0.1.0"
fs_extra = "1.3.0"
humantime = "2.1.0"
indicatif = "0.17.11"
lazy_static = "1.5.0"
memmap2 = "0.9.5"
path-clean = "1.0.1"
rand = "0.9.1"
regex = "1.11.0"
reqwest = { version = "0.12.15", features = ["blocking", "json", "zstd"] }
rustyline = "16.0.0"
semver = "1.0.25"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
shell-words = "1.1.0"
strum = "0.27.1"
strum_macros = "0.27.1"
sysinfo = "0.35.1"
tantivy = "0.22.0"
tar = "0.4.44"
toml = { version = "0.8.23", features = ["preserve_order"] }
trash = "5.2.2"
ts-rs = "10.1.0"
url = "2.5.4"
which = "7.0.2"
wildmatch = "2.4.0"
zstd = "0.13.3"
httpmock = "0.7.0"
dialoguer = "0.11.0"
tantivy-jieba = "0.11.0"
config = "0.15.9"
zip = "4.0.0"
bincode = "1.3.3"

[target.'cfg(windows)'.dependencies]
mslnk = "0.1.8"
pelite = "0.10.0"
vc-ltl = "5.2.1"
winapi = { version = "0.3.9", features = ["winuser", "minwindef"] }
winreg = "0.55.0"
winrt-notification = "0.5.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin_include)'] }
