[package]
name = "ept"
version = "0.3.1"
edition = "2021"

[profile.release]
lto = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
Inflector = "0.11.4"
anyhow = "1.0.100"
base64 = "0.22.1"
blake3 = { version = "1.8.2", features = ["rayon"] }
chrono = "0.4.42"
clap = { version = "4.5.53", features = ["derive"] }
colored = "3.0.0"
console = "0.16.1"
dirs = "6.0.0"
ed25519-compact = "2.2.0"
encoding = "0.2.33"
evalexpr = "13.1.0"
force-delete-win = "0.1.0"
fs_extra = "1.3.0"
humantime = "2.3.0"
indicatif = "0.18.3"
lazy_static = "1.5.0"
memmap2 = "0.9.9"
path-clean = "1.0.1"
rand = "0.9.2"
regex = "1.12.2"
reqwest = { version = "0.12.26", features = ["blocking", "json", "zstd"] }
rustyline = "17.0.2"
semver = "1.0.27"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
shell-words = "1.1.0"
strum = "0.27.2"
strum_macros = "0.27.2"
sysinfo = "0.37.2"
tantivy = "0.25.0"
tar = "0.4.44"
toml = { version = "0.9.8", features = ["preserve_order"] }
trash = "5.2.5"
ts-rs = "11.1.0"
url = "2.5.7"
which = "8.0.0"
wildmatch = "2.6.1"
zstd = "0.13.3"
httpmock = "0.8.2"
dialoguer = "0.12.0"
tantivy-jieba = "0.17.0"
config = "0.15.19"
zip = "7.0.0"
bincode = "1.3.3"

[target.'cfg(windows)'.dependencies]
mslnk = "0.1.8"
pelite = "0.10.0"
vc-ltl = "5.2.2"
winapi = { version = "0.3.9", features = ["winuser", "minwindef"] }
winreg = "0.55.0"
winrt-notification = "0.5.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin_include)'] }
