[workspace]
resolver = "2"
members = ["crates/ept-lib", "crates/ept-cli"]

[workspace.package]
version = "0.4.9"
edition = "2024"
authors = ["Cno"]
license = "MIT"
repository = "https://github.com/EdgelessPE/ept"

[workspace.dependencies]
# 内部 crate
ept-lib = { path = "crates/ept-lib", version = "0.4.9" }

# 基础依赖
anyhow = "1.0.100"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
toml = { version = "1.1.2", features = ["preserve_order"] }

[profile.release]
lto = true
