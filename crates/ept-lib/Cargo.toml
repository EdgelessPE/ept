[package]
name = "ept-lib"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Edgeless Package Tool - Core Library"

[dependencies]
Inflector = "0.11.4"
anyhow.workspace = true
base64 = "0.22.1"
blake3 = { version = "1.8.2", features = ["rayon"] }
chrono = "0.4.42"
colored = "3.0.0"
console = "0.16.2"
dirs = "6.0.0"
ed25519-compact = "2.2.0"
encoding = "0.2.33"
evalexpr = "13.1.0"
force-delete-win = "0.1.0"
fs_extra = "1.3.0"
humantime = "2.3.0"
indicatif = "0.18.4"
lazy_static = "1.5.0"
memmap2 = "0.9.9"
path-clean = "1.0.1"
rand = "0.9.2"
regex = "1.12.3"
reqwest = { version = "0.13.2", features = ["blocking", "json", "zstd"] }
semver = "1.0.27"
serde.workspace = true
serde_json.workspace = true
shell-words = "1.1.1"
strum = "0.27.2"
strum_macros = "0.27.2"
sysinfo = "0.38.1"
tantivy = "0.25.0"
tar = "0.4.44"
toml.workspace = true
trash = "5.2.5"
ts-rs = "12.0.1"
url = "2.5.8"
which = "8.0.0"
wildmatch = "2.6.1"
zstd = "0.13.3"
httpmock = "0.8.3"
tantivy-jieba = "0.18.0"
config = "0.15.19"
zip = "8.0.0"
postcard = { version = "1.1", features = ["use-std"] }

[target.'cfg(windows)'.dependencies]
mslnk = "0.1.8"
pelite = "0.10.0"
vc-ltl = "5.3.1"
winapi = { version = "0.3.9", features = ["winuser", "minwindef"] }
winreg = "0.55.0"
winrt-notification = "0.5.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin_include)'] }

[lib]
doctest = false